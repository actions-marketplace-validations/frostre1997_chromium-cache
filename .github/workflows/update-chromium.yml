name: Update Chromium Version
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Latest Stable Chromium Version
        id: get_version
        run: |
          # Fetch and parse the JSON to get the first version
          VERSION=$(curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Linux&num=1" | jq -r '.[0].version')
          echo "Latest version is: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Version File
        run: |
          echo "${{ steps.get_version.outputs.VERSION }}" > chromium_version.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Chromium version to ${{ steps.get_version.outputs.VERSION }}"
          title: "Update Chromium version to ${{ steps.get_version.outputs.VERSION }}"
          body: "This PR updates the Chromium version to the latest stable release."
          branch: "update-chromium-version"
