name: 'chromium-cache'
description: 'Cache the full full Chromium source code across GitHub Actions runs via external storage.'
author: 'frostre1997'
branding:
  icon: 'archive'
  color: 'blue'

inputs:
  mode:
    description: 'restore | save | both'
    default: 'both'
  version:
    description: 'Chromium version (e.g. 131.0.6778.85). Empty = latest stable.'
    default: ''
  path:
    description: 'Directory that will contain chromium/src (relative to GITHUB_WORKSPACE)'
    default: ''
  backend:
    description: 'rclone | ghcr | r2 | local'
    default: 'ghcr'
  backend-config:
    description: 'Backend-specific JSON config'
    default: '{}'
  force-save:
    description: 'Re-push even if version already exists'
    default: 'false'
  min-free-gb:
    description: 'Pre-flight free-space assertion (GB)'
    default: '30'
  exclude:
    description: 'Comma-separated glob patterns to strip before save'
    default: ''
  shallow:
    description: 'Use --no-history on fetch'
    default: 'true'
  probe-only:
    description: 'Report cache hit + size without downloading or saving'
    default: 'false'

outputs:
  cache-hit:
    description: '"true" if restored from cache'
    value: ${{ steps.run.outputs.cache-hit }}
  path:
    description: 'Absolute path to chromium/src'
    value: ${{ steps.run.outputs.path }}
  version:
    description: 'Resolved Chromium version'
    value: ${{ steps.run.outputs.version }}
  remote-size-gb:
    description: 'Size on backend for this version (GB)'
    value: ${{ steps.run.outputs.remote-size-gb }}

runs:
  using: composite
  steps:
    - name: Install oras (if needed)
      if: inputs.backend == 'ghcr'
      shell: bash
      run: |
        if command -v oras >/dev/null; then
          echo "oras already installed: $(oras version | head -1)"
          exit 0
        fi
        set -e
        ORAS_VER=1.2.0
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL "https://github.com/oras-project/oras/releases/download/v${ORAS_VER}/oras_${ORAS_VER}_linux_amd64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP/bin" oras
        chmod +x "$RUNNER_TEMP/bin/oras"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Install rclone (if needed)
      if: inputs.backend == 'rclone' || inputs.backend == 'r2'
      shell: bash
      run: |
        if command -v rclone >/dev/null; then
          echo "rclone already installed: $(rclone version | head -1)"
          exit 0
        fi
        set -e
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL "https://downloads.rclone.org/rclone-current-linux-amd64.zip" \
          -o "$RUNNER_TEMP/rclone.zip"
        unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-install"
        install -m 0755 "$RUNNER_TEMP"/rclone-install/rclone-*/rclone "$RUNNER_TEMP/bin/rclone"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - id: run
      shell: bash
      run: python3 "${{ github.action_path }}/src/main.py"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_BACKEND_CONFIG: ${{ inputs.backend-config }}
        INPUT_FORCE_SAVE: ${{ inputs.force-save }}
        INPUT_MIN_FREE_GB: ${{ inputs.min-free-gb }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_SHALLOW: ${{ inputs.shallow }}
        INPUT_PROBE_ONLY: ${{ inputs.probe-only }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_ACTOR: ${{ github.actor }}
        GH_TOKEN: ${{ github.token }}
